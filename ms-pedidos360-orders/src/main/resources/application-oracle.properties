# Perfil oracle: Oracle Autonomous Database.
# Credenciales por variables de entorno, nunca en el repositorio.
# Ver instrucciones detalladas en ms-pedidos360-catalog/src/main/resources/application-oracle.properties

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
