# Perfil oracle: Oracle Autonomous Database.
# Las credenciales NUNCA se escriben aqui: se inyectan por variables de entorno.
#
# Conexion con wallet descargado desde la consola de OCI:
#   1. Descomprimir el wallet en la instancia, por ejemplo /opt/oracle/wallet
#   2. export TNS_ADMIN=/opt/oracle/wallet
#   3. export ORACLE_JDBC_URL=jdbc:oracle:thin:@pedidos360_high?TNS_ADMIN=/opt/oracle/wallet
#      (pedidos360_high es un alias definido en tnsnames.ora dentro del wallet)
#   4. export ORACLE_USER=ADMIN
#   5. export ORACLE_PASSWORD='...'
#
# Conexion sin wallet (mTLS desactivado en la ADB):
#   export ORACLE_JDBC_URL="jdbc:oracle:thin:@(description=(retry_count=5)(address=(protocol=tcps)(port=1522)(host=...))(connect_data=(service_name=...))(security=(ssl_server_dn_match=yes)))"

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# La capa gratuita de ADB tiene pocas sesiones: pool chico a proposito.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# En la defensa conviene 'update' para que Hibernate cree PRODUCTO y PRODUCTO_SEQ solo.
# Para produccion real esto se reemplaza por scripts versionados (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
