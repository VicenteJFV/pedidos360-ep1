# Perfil oracle: la conexion se define por variables de entorno, nunca aqui.
#
# ---------------------------------------------------------------------------
# Opcion A - Oracle en Amazon RDS (lo que usa este proyecto)
# ---------------------------------------------------------------------------
# Creado con aws/04-crear-oracle-rds.ps1. No necesita wallet: la instancia vive
# dentro de la VPC y solo acepta conexiones desde el Security Group de la EC2.
#
#   ORACLE_JDBC_URL=jdbc:oracle:thin:@//<endpoint>.rds.amazonaws.com:1521/PEDIDOS
#   ORACLE_USER=admin
#   ORACLE_PASSWORD=...
#
# ---------------------------------------------------------------------------
# Opcion B - Oracle Autonomous Database en OCI
# ---------------------------------------------------------------------------
# Requiere el wallet descargado desde la consola de OCI:
#   1. Descomprimirlo en la instancia, por ejemplo /opt/pedidos360/wallet
#   2. export TNS_ADMIN=/opt/pedidos360/wallet
#   3. export ORACLE_JDBC_URL=jdbc:oracle:thin:@pedidos360_high?TNS_ADMIN=/opt/pedidos360/wallet
#      (pedidos360_high es un alias de tnsnames.ora dentro del wallet)
#   4. export ORACLE_USER=ADMIN
#   5. export ORACLE_PASSWORD=...

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# 'update' deja que Hibernate cree las tablas y secuencias en el primer arranque.
# En un sistema real esto se reemplaza por scripts versionados (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
