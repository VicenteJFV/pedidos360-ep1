spring.application.name=ms-pedidos360-catalog

# Puerto interno del microservicio de catalogo.
server.port=8082

# SEGURIDAD DE RED: por defecto escucha SOLO en loopback, asi el microservicio
# no es alcanzable desde Internet aunque el Security Group se configure mal.
# Solo el BFF, que corre en la misma instancia, puede llamarlo.
# En Docker con red bridge hay que sobrescribirlo: MS_BIND_ADDRESS=0.0.0.0
# y en ese caso NO publicar el puerto con -p.
server.address=${MS_BIND_ADDRESS:127.0.0.1}

# Perfil por defecto: H2 en memoria. Para Oracle: --spring.profiles.active=oracle
spring.profiles.active=${SPRING_PROFILE:dev}

spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.cl.duoc.pedidos360=INFO
